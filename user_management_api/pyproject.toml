[project]
name = "user-management-api"
version = "0.1.0"
authors = [
    {name = "Yulya Sarokina"}
]
readme = "README.md"
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "sqlalchemy-utils (>=0.42.1,<0.43.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "redis (>=7.3.0,<8.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "phonenumbers (>=9.0.26,<10.0.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pillow (>=12.2.0,<13.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "fastapi-pagination (>=0.15.12,<0.16.0)",
    "fastapi-filter (>=2.0.1,<3.0.0)",
    "aio-pika (>=9.6.2,<10.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
]

[tool.poetry]
packages = [{include = "user_management_api", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.5,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)"
]