services:
    db_ums:
      image: postgres:17-alpine
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s
      container_name: psgr
      environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASS}
        - POSTGRES_DB=${DB_NAME}
      volumes:
        - postgres-data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      networks:
        - inner-net

    redis:
      image: redis:latest
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: redis-server --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD} --appendonly yes
      networks:
        - inner-net

    rabbitmq:
      image: rabbitmq:3-management
      healthcheck:
        test: "rabbitmqctl node_health_check"
        interval: 10s
        timeout: 10s
        retries: 20
        start_period: 20s
      container_name: rabbit
      environment:
        - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST}
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      ports:
        - "5672:5672"
        - "15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      networks:
        - inner-net


    ums_app:
      build: .
      command: >
        sh -c "alembic upgrade head &&
        uvicorn src.user_management_api.main:app --host 0.0.0.0 --port 8000"
      environment:
        - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@db_ums:5432/${DB_NAME}
        - REDIS_HOST=${REDIS_HOST}
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - REDIS_PORT=${REDIS_PORT}
        - SECRET_KEY=${SECRET_KEY}
        - ALGORITHM=${ALGORITHM}
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        - AWS_REGION=${AWS_REGION}
        - BUCKET_NAME=${BUCKET_NAME}
        - RABBITMQ_URL=${RABBITMQ_URL}
        - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      depends_on:
        db_ums:
          condition: service_healthy
        redis:
          condition: service_started
        rabbitmq:
          condition: service_healthy
      ports:
        - "8000:8000"
      networks:
        - inner-net

volumes:
  postgres-data:
  redis_data:
  rabbitmq_data:

networks:
  inner-net:
    external: true